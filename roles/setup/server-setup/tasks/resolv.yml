---
- name: Validate resolver configuration
  ansible.builtin.assert:
    that:
      - server_setup_resolv_nameservers is sequence and server_setup_resolv_nameservers is not string and server_setup_resolv_nameservers is not mapping
      - server_setup_resolv_nameservers | length > 0
      - server_setup_resolv_search is sequence and server_setup_resolv_search is not string and server_setup_resolv_search is not mapping
      - server_setup_resolv_options is sequence and server_setup_resolv_options is not string and server_setup_resolv_options is not mapping
      - server_setup_resolv_nameservers | reject('match', '^[0-9A-Fa-f:.%]+$') | list | length == 0
      - server_setup_resolv_search | reject('match', '^[A-Za-z0-9_.-]+$') | list | length == 0
      - server_setup_resolv_options | reject('match', '^[A-Za-z0-9_:-]+$') | list | length == 0
    fail_msg: Use lists for resolver settings and provide at least one nameserver IP address through server_setup_resolv_nameservers.
  when: server_setup_manage_resolv_conf

- name: Configure /etc/resolv.conf
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
    follow: true
  when: server_setup_manage_resolv_conf
