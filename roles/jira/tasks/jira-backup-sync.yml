---
- name: Validate Jira remote backup settings
  ansible.builtin.assert:
    that:
      - jira_remote_backup_host | length > 0
      - jira_remote_backup_user | length > 0
      - jira_remote_backup_path | length > 0
      - jira_remote_backup_port | int > 0
      - jira_remote_backup_port | int <= 65535
    fail_msg: "Set jira_remote_backup_host, user, path, and a valid SSH port when remote backup sync is enabled."
  tags:
    - backup
    - cron

- name: Install rsync for Jira backup sync
  ansible.builtin.package:
    name: rsync
    state: present
  tags:
    - backup
    - cron

- name: Create root SSH directory for Jira backup sync
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: jira_remote_backup_known_hosts | length > 0
  tags:
    - backup
    - cron

- name: Install Jira backup server host keys
  ansible.builtin.known_hosts:
    path: /root/.ssh/known_hosts
    name: "{{ item.name | default(jira_remote_backup_host) }}"
    key: "{{ item.key }}"
    state: present
  loop: "{{ jira_remote_backup_known_hosts }}"
  tags:
    - backup
    - cron

- name: Template Jira backup sync script
  ansible.builtin.template:
    src: jira-backup-sync.sh.j2
    dest: "{{ jira_remote_backup_script_path }}"
    owner: root
    group: root
    mode: "0750"
  tags:
    - backup
    - cron

- name: Create cron file under /etc/cron.d for Jira backup sync
  ansible.builtin.cron:
    name: jira-backup-sync
    weekday: "{{ jira_remote_backup_cron_weekday }}"
    month: "{{ jira_remote_backup_cron_month }}"
    day: "{{ jira_remote_backup_cron_day }}"
    hour: "{{ jira_remote_backup_cron_hour }}"
    minute: "{{ jira_remote_backup_cron_minute }}"
    user: root
    job: "{{ jira_remote_backup_script_path }} >> {{ jira_remote_backup_log_path }} 2>&1"
    cron_file: "{{ jira_remote_backup_cron_file }}"
  tags:
    - backup
    - cron
