---
- name: Verify that an explicitly disabled role profile does not change the host
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    linux_hardening_disable_core_dumps: false
    linux_hardening_disable_ctrl_alt_del: false
    linux_hardening_cron_permissions: false
    linux_hardening_shadow_permissions: false
    linux_hardening_passwd_permissions: false
    linux_hardening_restrict_su: false
    linux_hardening_minimize_path_permissions: false
    linux_hardening_remove_insecure_packages: false
    linux_hardening_remove_pam_ccreds: false
    linux_hardening_pam_passwdqc: false
    linux_hardening_pam_faillock: false
    linux_hardening_pam_no_pass_expiry: false
    linux_hardening_libuser_hash: false
    linux_hardening_securetty: false
    linux_hardening_shell_timeout: false
    linux_hardening_shell_umask: false
    linux_hardening_remove_rhosts: false
    linux_hardening_remove_hosts_equiv: false
    linux_hardening_remove_netrc: false
    linux_hardening_suid_blacklist_enabled: false
    linux_hardening_suid_remove_unknown: false
    linux_hardening_system_account_shells: false
    linux_hardening_system_account_lock: false
    linux_hardening_user_password_ageing: false
    linux_hardening_root_password_ageing: false
    linux_hardening_remove_duplicate_root: false
    linux_hardening_root_home_permissions: false
    linux_hardening_user_home_permissions: false
    linux_hardening_auditd_install: false
    linux_hardening_auditd_service: false
    linux_hardening_disable_journald_audit: false
    linux_hardening_refresh_initramfs: false
    linux_hardening_kernel_parameters: false
    linux_hardening_login_defs_permissions: false
    linux_hardening_sysctl_permissions: false
    linux_hardening_auditd_permissions: false
    linux_hardening_login_defs: {}
    linux_hardening_faillock_settings: {}
    linux_hardening_auditd_settings: {}
    linux_hardening_sysctl_settings: {}
    linux_hardening_modules: {}
    linux_hardening_mounts: {}
    ssh_hardening_install_server: false
    ssh_hardening_install_client: false
    ssh_hardening_enable_service: false
    ssh_hardening_disable_pam_motd: false
    ssh_hardening_regenerate_rsa_key: false
    ssh_hardening_host_key_permissions: false
    ssh_hardening_filter_moduli: false
    ssh_hardening_server_config_permissions: false
    ssh_hardening_client_config_permissions: false
    ssh_hardening_server_directives: {}
    ssh_hardening_client_directives: {}
    iptables_hardening_enabled: false
  roles:
    - role: linux-hardening
