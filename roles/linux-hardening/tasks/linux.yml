---
- name: Remove explicitly selected insecure packages
  ansible.builtin.apt:
    name: "{{ linux_hardening_insecure_packages }}"
    state: absent
    purge: true
  when: linux_hardening_remove_insecure_packages is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Remove cached PAM credentials package
  ansible.builtin.apt:
    name: libpam-ccreds
    state: absent
  when: linux_hardening_remove_pam_ccreds is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Disable core dumps in PAM, systemd and login shells
  ansible.builtin.include_tasks: core_dumps.yml
  when: linux_hardening_disable_core_dumps is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Mask console reboot shortcut
  ansible.builtin.systemd_service:
    name: ctrl-alt-del.target
    masked: true
  when: linux_hardening_disable_ctrl_alt_del is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Discover existing cron configuration
  ansible.builtin.find:
    paths: /etc
    patterns:
      - cron.hourly
      - cron.daily
      - cron.weekly
      - cron.monthly
      - cron.d
      - crontab
    file_type: any
  register: linux_hardening_cron_files
  when: linux_hardening_cron_permissions is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Restrict existing cron configuration
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: og-rwx
  loop: "{{ linux_hardening_cron_files.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: linux_hardening_cron_permissions is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Inspect shadow database files
  ansible.builtin.stat:
    path: "/etc/{{ item }}"
  loop:
    - shadow
    - gshadow
    - shadow-
    - gshadow-
  register: linux_hardening_shadow_files
  when: linux_hardening_shadow_permissions is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Protect shadow database files
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    owner: root
    group: shadow
    mode: '0640'
  loop: "{{ linux_hardening_shadow_files.results | default([]) }}"
  when:
    - linux_hardening_shadow_permissions is sameas true
    - item.stat.exists
  loop_control:
    label: "{{ item.item }}"
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Inspect passwd database files
  ansible.builtin.stat:
    path: "/etc/{{ item }}"
  loop:
    - passwd
    - group
    - passwd-
    - group-
  register: linux_hardening_passwd_files
  when: linux_hardening_passwd_permissions is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Protect passwd database files
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ linux_hardening_passwd_files.results | default([]) }}"
  when:
    - linux_hardening_passwd_permissions is sameas true
    - item.stat.exists
  loop_control:
    label: "{{ item.item }}"
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Restrict su execution
  ansible.builtin.file:
    path: /bin/su
    owner: root
    group: root
    mode: '0750'
  when: linux_hardening_restrict_su is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Find writable executables in system search paths
  ansible.builtin.command:
    argv: |-
      {{ ['find', '-H'] + linux_hardening_path_directories + ['-type', 'f', '-perm', '/022',
      '-print'] }}
  changed_when: false
  check_mode: false
  register: linux_hardening_writable_paths
  when: linux_hardening_minimize_path_permissions is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Remove unprivileged write permissions from system executables
  ansible.builtin.file:
    path: "{{ item }}"
    mode: go-w
  loop: "{{ linux_hardening_writable_paths.stdout_lines | unique }}"
  when: linux_hardening_minimize_path_permissions is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Apply explicitly enabled login defaults
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^\\s*{{ item.key }}\\s+"
    line: "{{ item.key }} {{ item.value.value }}"
  loop: |-
    {{ linux_hardening_login_defs | dict2items | selectattr('value.enabled', 'sameas', true) | list
    }}
  loop_control:
    label: "{{ item.key }}"
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Set login shell timeout
  ansible.builtin.copy:
    dest: /etc/profile.d/linux-hardening-timeout.sh
    content: |
      export TMOUT={{ linux_hardening_shell_timeout_seconds }}
      readonly TMOUT
    owner: root
    group: root
    mode: '0644'
  when: linux_hardening_shell_timeout is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Set login shell umask
  ansible.builtin.copy:
    dest: /etc/profile.d/linux-hardening-umask.sh
    content: |
      umask {{ linux_hardening_umask }}
    owner: root
    group: root
    mode: '0644'
  when: linux_hardening_shell_umask is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Restrict console root terminals
  ansible.builtin.copy:
    dest: /etc/securetty
    content: |
      {{ linux_hardening_root_ttys | join('
      ') }}
    owner: root
    group: root
    mode: '0400'
  when: linux_hardening_securetty is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Apply individually enabled kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value.value }}"
    sysctl_file: /etc/sysctl.d/90-linux-hardening.conf
    sysctl_set: true
    reload: false
    state: present
    ignoreerrors: false
  loop: |-
    {{ linux_hardening_sysctl_settings | dict2items | selectattr('value.enabled', 'sameas', true) |
    list }}
  when: linux_hardening_kernel_parameters is sameas true
  loop_control:
    label: "{{ item.key }}"
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Disable selected unused kernel modules
  ansible.builtin.include_tasks: modules.yml
  when: linux_hardening_modules.values() | select('sameas', true) | list | length > 0
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Manage selected mounts
  ansible.builtin.include_tasks: mount.yml
  loop: "{{ linux_hardening_mounts | dict2items }}"
  loop_control:
    loop_var: linux_hardening_mount
    label: "{{ linux_hardening_mount.key }}"
  when: linux_hardening_mount.value.enabled is sameas true or linux_hardening_mount.value.permissions_enabled is
    sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Apply PAM controls
  ansible.builtin.import_tasks: pam.yml
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Install audit daemon
  ansible.builtin.apt:
    name: auditd
    state: present
    policy_rc_d: 101
  when: linux_hardening_auditd_install is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Apply enabled audit settings
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value.value }}"
  loop: |-
    {{ linux_hardening_auditd_settings | dict2items | selectattr('value.enabled', 'sameas', true) |
    list }}
  loop_control:
    label: "{{ item.key }}"
  notify: Linux hardening restart auditd
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Enable audit daemon
  ansible.builtin.systemd_service:
    name: auditd
    state: started
    enabled: true
  when: linux_hardening_auditd_service is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Disable duplicate journald audit listener
  ansible.builtin.systemd_service:
    name: systemd-journald-audit.socket
    state: stopped
    enabled: false
    masked: true
  notify: Linux hardening restart journald
  when: linux_hardening_disable_journald_audit is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Read and harden local user accounts only when needed
  ansible.builtin.include_tasks: accounts.yml
  when: linux_hardening_remove_rhosts is sameas true or linux_hardening_remove_netrc is sameas true or linux_hardening_system_account_shells
    is sameas true or linux_hardening_system_account_lock is sameas true or linux_hardening_user_password_ageing
    is sameas true or linux_hardening_root_password_ageing is sameas true or linux_hardening_remove_duplicate_root
    is sameas true or linux_hardening_root_home_permissions is sameas true or linux_hardening_user_home_permissions
    is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Remove legacy host trust file
  ansible.builtin.file:
    path: /etc/hosts.equiv
    state: absent
  when: linux_hardening_remove_hosts_equiv is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Inspect blacklisted privileged binaries
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  loop: "{{ linux_hardening_suid_blacklist }}"
  register: linux_hardening_suid_files
  when: linux_hardening_suid_blacklist_enabled is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Remove privilege bits from blacklisted binaries
  ansible.builtin.file:
    path: "{{ item.item }}"
    mode: a-s
    follow: true
  loop: "{{ linux_hardening_suid_files.results | default([]) }}"
  when:
    - linux_hardening_suid_blacklist_enabled is sameas true
    - item.stat.exists
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Find privileged binaries on the root filesystem
  ansible.builtin.command:
    argv:
      - find
      - /
      - -xdev
      - -type
      - f
      - (
      - -perm
      - '-4000'
      - -o
      - -perm
      - '-2000'
      - )
      - -print
  changed_when: false
  check_mode: false
  register: linux_hardening_privileged_files
  when: linux_hardening_suid_remove_unknown is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Remove unexpected privilege bits
  ansible.builtin.file:
    path: "{{ item }}"
    mode: a-s
    follow: true
  loop: |-
    {{ linux_hardening_privileged_files.stdout_lines | difference(linux_hardening_suid_whitelist)
    }}
  when: linux_hardening_suid_remove_unknown is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Protect login_defs configuration permissions
  ansible.builtin.file:
    path: /etc/login.defs
    owner: root
    group: root
    mode: '0444'
  when: linux_hardening_login_defs_permissions is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Protect sysctl configuration permissions
  ansible.builtin.file:
    path: /etc/sysctl.d/90-linux-hardening.conf
    owner: root
    group: root
    mode: '0440'
  when: linux_hardening_sysctl_permissions is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Protect auditd configuration permissions
  ansible.builtin.file:
    path: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: '0640'
  when: linux_hardening_auditd_permissions is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux

- name: Manage explicitly requested SELinux mode on an already provisioned host
  ansible.posix.selinux:
    policy: "{{ linux_hardening_selinux_policy }}"
    state: "{{ linux_hardening_selinux_state }}"
  when: linux_hardening_selinux_enabled is sameas true
  tags:
    - linux-hardening
    - linux-hardening-linux
