---
# minikube installation tasks

- name: Validate minikube target platform
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
      - ansible_facts['architecture'] in minikube_arch_map
    fail_msg: >-
      minikube supports this role's target platforms only on Linux amd64 and arm64.
      Found: {{ ansible_facts.get('system', 'unknown') }}/{{ ansible_facts.get('architecture', 'unknown') }}
  tags:
    - minikube
    - minikube-install

- name: Create minikube installation directory
  ansible.builtin.file:
    path: "{{ minikube_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  tags:
    - minikube
    - minikube-install

- name: Download minikube binary
  ansible.builtin.get_url:
    url: "{{ minikube_download_url }}"
    dest: "{{ minikube_binary_path }}"
    checksum: "sha256:{{ minikube_checksums[minikube_arch_map[ansible_facts['architecture']]] }}"
    owner: root
    group: root
    mode: '0755'
  become: true
  tags:
    - minikube
    - minikube-install
