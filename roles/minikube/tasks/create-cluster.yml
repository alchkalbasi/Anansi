---
# minikube cluster lifecycle tasks

- name: Check minikube profile status
  ansible.builtin.command:
    argv:
      - "{{ minikube_binary_path }}"
      - status
      - --profile
      - "{{ minikube_profile }}"
      - --output
      - json
  environment:
    MINIKUBE_HOME: "{{ minikube_effective_home }}"
  register: minikube_profile_status
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ minikube_effective_user }}"
  tags:
    - minikube
    - minikube-cluster

- name: Create or start configured minikube profile
  ansible.builtin.command:
    argv:
      - "{{ minikube_binary_path }}"
      - start
      - --profile
      - "{{ minikube_profile }}"
      - --driver
      - "{{ minikube_driver }}"
      - --kubernetes-version
      - "{{ minikube_kubernetes_version }}"
  environment:
    MINIKUBE_HOME: "{{ minikube_effective_home }}"
  when: minikube_profile_status.rc != 0
  changed_when: true
  become: true
  become_user: "{{ minikube_effective_user }}"
  tags:
    - minikube
    - minikube-cluster

- name: Configure minikube addons
  ansible.builtin.include_tasks: addons.yml
  tags:
    - minikube
    - minikube-cluster
    - minikube-addon
