  SUB_UID_MIN:
    enabled: false
    value: '100000'
  SUB_UID_MAX:
    enabled: false
    value: '600100000'
  SUB_UID_COUNT:
    enabled: false
    value: '65536'
  SUB_GID_MIN:
    enabled: false
    value: '100000'
  SUB_GID_MAX:
    enabled: false
    value: '600100000'
  SUB_GID_COUNT:
    enabled: false
    value: '65536'
  LOGIN_RETRIES:
    enabled: false
    value: '5'
  LOGIN_TIMEOUT:
    enabled: false
    value: '60'
  CHFN_RESTRICT:
    enabled: false
    value: ''
  DEFAULT_HOME:
    enabled: false
    value: 'no'
  ENCRYPT_METHOD:
    enabled: false
    value: YESCRYPT
  SHA_CRYPT_MIN_ROUNDS:
    enabled: false
    value: '640000'
  SHA_CRYPT_MAX_ROUNDS:
    enabled: false
    value: '640000'
linux_hardening_auditd_settings:
  write_logs:
    enabled: true
    value: 'yes'
  log_file:
    enabled: true
    value: /var/log/audit/audit.log
  log_format:
    enabled: true
    value: RAW
  log_group:
    enabled: true
    value: root
  priority_boost:
    enabled: true
    value: '4'
  flush:
    enabled: true
    value: INCREMENTAL_ASYNC
  freq:
    enabled: true
    value: '100'
  num_logs:
    enabled: true
    value: '10'
  name_format:
    enabled: true
    value: HOSTNAME
  max_log_file:
    enabled: true
    value: '100'
  max_log_file_action:
    enabled: true
    value: keep_logs
  space_left:
    enabled: true
    value: '10%'
  space_left_action:
    enabled: true
    value: SYSLOG
  action_mail_acct:
    enabled: false
    value: root
  admin_space_left:
    enabled: true
    value: '5%'
  admin_space_left_action:
    enabled: true
    value: SUSPEND
  disk_full_action:
    enabled: true
    value: SUSPEND
  disk_error_action:
    enabled: true
    value: SYSLOG
  tcp_listen_queue:
    enabled: false
    value: '5'
  tcp_max_per_addr:
    enabled: false
    value: '1'
  tcp_client_max_idle:
    enabled: false
    value: '0'
  krb5_principal:
    enabled: false
    value: auditd
  transport:
    enabled: false
    value: TCP
linux_hardening_mounts:
  proc:
    # /proc is normally managed by the OS/kernel.
    # Do not modify it through fstab unless hidepid has been
    # explicitly tested with monitoring/security agents.
    enabled: false
    permissions_enabled: false
    path: /proc
    src: proc
    fstype: proc
    opts: rw,nosuid,nodev,noexec,relatime
    mode: '0555'
    owner: root
    group: root
    dump: '0'
    passno: '0'
  boot:
    # Enable mount hardening only if /boot is an actual
    # separate mount point.
    enabled: false
    permissions_enabled: false
    path: /boot
    src: ''
    fstype: ''
    opts: rw,nosuid,nodev,noexec
    mode: '0755'
    owner: root
    group: root
    dump: '0'
    passno: '2'
  dev:
    # /dev is managed dynamically by devtmpfs/udev.
    # Do not manage it through this generic mount role.
    enabled: false
    permissions_enabled: false
    path: /dev
    src: devtmpfs
    fstype: devtmpfs
    opts: rw,nosuid,noexec
    mode: '0755'
    owner: root
    group: root
    dump: '0'
    passno: '0'
  dev_shm:
    # Recommended hardening:
    # nosuid,nodev,noexec
    # Enable only after confirming /dev/shm is a standalone
    # tmpfs and that applications do not execute code from it.
    enabled: false
    permissions_enabled: true
    path: /dev/shm
    src: tmpfs
    fstype: tmpfs
    opts: rw,nosuid,nodev,noexec
    mode: '1777'
    owner: root
    group: root
    dump: '0'
    passno: '0'
  home:
    # If /home is a separate filesystem, change enabled to true.
    # Do NOT normally add noexec because applications/users may
    # legitimately execute scripts/binaries from their home.
    enabled: false
    permissions_enabled: true
    path: /home
    src: ''
    fstype: ''
    opts: rw,nosuid,nodev
    mode: '0755'
    owner: root
    group: root
    dump: '0'
    passno: '2'
  run:
    # /run is normally dynamically managed by systemd as tmpfs.
    # Avoid creating/replacing its fstab configuration.
    enabled: false
    permissions_enabled: false
    path: /run
    src: tmpfs
    fstype: tmpfs
    opts: rw,nosuid,nodev
    mode: '0755'
    owner: root
    group: root
    dump: '0'
    passno: '0'
  tmp:
    # Safe directory permissions regardless of whether /tmp
    # has its own filesystem.
    # If /tmp IS a dedicated mount, change enabled to true.
    enabled: false
    permissions_enabled: true
    path: /tmp
    src: ''
    fstype: ''
    opts: rw,nosuid,nodev,noexec
    mode: '1777'
    owner: root
    group: root
    dump: '0'
    passno: '0'
  var:
    # Generally avoid noexec on /var because applications,
    # package managers and services can depend on its contents.
    # Enable only if /var is a separate mount.
    enabled: false
    permissions_enabled: true
    path: /var
    src: ''
    fstype: ''
    opts: rw,nosuid,nodev
    mode: '0755'
    owner: root
    group: root
    dump: '0'
    passno: '2'
  var_log:
    # Strong candidate for nodev,nosuid,noexec IF it is a
    # standalone filesystem.
    enabled: false
    permissions_enabled: true
    path: /var/log
    src: ''
    fstype: ''
    opts: rw,nosuid,nodev,noexec
    mode: '0755'
    owner: root
    group: "{{ 'syslog' if ansible_facts.distribution == 'Ubuntu' else 'root' }}"
    dump: '0'
    passno: '2'
  var_log_audit:
    # Strong hardening candidate if audit logs have their
    # own filesystem.
    enabled: false
    permissions_enabled: true
    path: /var/log/audit
    src: ''
    fstype: ''
    opts: rw,nosuid,nodev,noexec
    mode: '0700'
    owner: root
    group: root
    dump: '0'
    passno: '2'
  var_tmp:
    # Safe directory permission.
    # Enable mount hardening if /var/tmp is a dedicated mount.
    enabled: false
    permissions_enabled: true
    path: /var/tmp
    src: ''
    fstype: ''
    opts: rw,nosuid,nodev,noexec
    mode: '1777'
    owner: root
    group: root
    dump: '0'
    passno: '0'
ssh_hardening_install_server: true
ssh_hardening_install_client: true
ssh_hardening_enable_service: true
ssh_hardening_disable_pam_motd: false
ssh_hardening_regenerate_rsa_key: true
ssh_hardening_host_key_permissions: true
ssh_hardening_filter_moduli: true
ssh_hardening_server_config_permissions: true
ssh_hardening_client_config_permissions: false
ssh_hardening_rsa_key_size: 4096
ssh_hardening_moduli_minimum: 2048
# Source relative to this role's files directory; empty leaves the remote file unmanaged.
ssh_hardening_banner_src: ssh_banner
ssh_hardening_server_directives:
  PermitRootLogin:
    enabled: true
    value: 'no'
  Port:
    enabled: true
    value: '4578'
  AddressFamily:
    enabled: true
    value: any
  # If possible, bind only to a management/private IP instead.
  # These values expose SSH on all IPv4 and IPv6 interfaces.
  ListenAddress:
    enabled: true
    value:
      - 0.0.0.0
      - '::'
  HostKey:
    enabled: true
    value:
      - /etc/ssh/ssh_host_ed25519_key
      - /etc/ssh/ssh_host_rsa_key
  # Only enable when you actually use SSH host certificates.
  HostCertificate:
    enabled: false
    value: []
  HostKeyAlgorithms:
    enabled: true
    value: ssh-ed25519,rsa-sha2-512,rsa-sha2-256
  StrictModes:
    enabled: true
    value: 'yes'
  SyslogFacility:
    enabled: true
    value: AUTH
  LogLevel:
    enabled: true
    value: VERBOSE
  Ciphers:
    enabled: true
    value: chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
  MACs:
    enabled: true
    value: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
  KexAlgorithms:
    enabled: true
    value: sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
  LoginGraceTime:
    enabled: true
    value: 60s
  MaxAuthTries:
    enabled: true
    value: '6'
  MaxSessions:
    enabled: true
    value: '10'
  MaxStartups:
    enabled: true
    value: 10:30:60
  PubkeyAuthentication:
    enabled: true
    value: 'yes'
  AuthenticationMethods:
    enabled: true
    value: publickey
  PasswordAuthentication:
    enabled: true
    value: 'no'
  KbdInteractiveAuthentication:
    enabled: true
    value: 'no'
  PermitEmptyPasswords:
    enabled: true
    value: 'no'
  # Important on Debian/Ubuntu.
  # Keep PAM enabled even when password authentication is disabled.
  UsePAM:
    enabled: true
    value: 'yes'
  IgnoreRhosts:
    enabled: true
    value: 'yes'
  IgnoreUserKnownHosts:
    enabled: false
    value: 'yes'
  HostbasedAuthentication:
    enabled: true
    value: 'no'
  KerberosAuthentication:
    enabled: true
    value: 'no'
  KerberosOrLocalPasswd:
    enabled: true
    value: 'no'
  KerberosTicketCleanup:
    enabled: true
    value: 'yes'
  GSSAPIAuthentication:
    enabled: true
    value: 'no'
  GSSAPICleanupCredentials:
    enabled: true
    value: 'yes'
  DenyUsers:
    enabled: false
    value: ''
  AllowUsers:
    enabled: false
    value: ''
  DenyGroups:
    enabled: false
    value: ''
  # Stronger option if you create a dedicated SSH group, e.g. ssh-users.
  # Don't enable this until every administrator is actually a member.
  AllowGroups:
    enabled: false
    value: ''
  AuthorizedKeysFile:
    enabled: true
    value: .ssh/authorized_keys
  # Leave these disabled unless you intentionally operate an SSH CA.
  TrustedUserCAKeys:
    enabled: false
    value: /etc/ssh/trusted-user-ca-keys
  AuthorizedPrincipalsFile:
    enabled: false
    value: /etc/ssh/auth_principals/%u
  RevokedKeys:
    enabled: false
    value: /etc/ssh/revoked_keys
  TCPKeepAlive:
    enabled: true
    value: 'yes'
  ClientAliveInterval:
    enabled: true
    value: '300'
  ClientAliveCountMax:
    enabled: true
    value: '2'
  PermitTunnel:
    enabled: true
    value: 'no'
  AllowTcpForwarding:
    enabled: true
    value: 'no'
  AllowAgentForwarding:
    enabled: true
    value: 'no'
  GatewayPorts:
    enabled: true
    value: 'no'
  X11Forwarding:
    enabled: true
    value: 'no'
  X11UseLocalhost:
    enabled: true
    value: 'yes'
  PermitUserEnvironment:
    enabled: true
    value: 'no'
  # LANG/LC_* is common on Debian/Ubuntu, but not required for SSH itself.
  AcceptEnv:
    enabled: false
    value: LANG LC_*
  Compression:
    enabled: true
    value: 'no'
  UseDNS:
    enabled: true
    value: 'no'
  # Debian/Ubuntu generally handles MOTD through PAM.
  PrintMotd:
    enabled: true
    value: 'yes'
  PrintLastLog:
    enabled: true
    value: 'yes'
  # Banner content is copied from ssh_hardening_banner_src.
  Banner:
    enabled: true
    value: /etc/issue.net
  DebianBanner:
    enabled: true
    value: 'no'
  # Keep this enabled unless you deliberately want to prohibit SFTP/SCP.
  Subsystem:
    enabled: true
    value: sftp internal-sftp -l INFO -f LOCAL6 -u 0027
ssh_hardening_client_directives:
  AddressFamily:
    enabled: false
    value: any
  Port:
    enabled: false
    value: '22'
  # Keep interactive behavior unless this host is only used for automation.
  BatchMode:
    enabled: false
    value: 'no'
  # Modern OpenSSH defaults this to no.
  # It can create extra known_hosts entries by IP and may be awkward behind
  # load balancers, NAT, proxies, and frequently changing infrastructure.
  CheckHostIP:
    enabled: true
    value: 'no'
  # Strong host identity verification.
  # "yes" is strictest, but requires known_hosts to be provisioned beforehand.
  StrictHostKeyChecking:
    enabled: true
    value: 'yes'
  # I prefer letting the installed OpenSSH version select its modern defaults
  # unless a security baseline explicitly requires pinning these.
  Ciphers:
    enabled: false
    value: chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
  MACs:
    enabled: false
    value: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
  KexAlgorithms:
    enabled: false
    value: sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
  HostKeyAlgorithms:
    enabled: false
    value: ssh-ed25519,rsa-sha2-512,rsa-sha2-256
  ForwardAgent:
    enabled: true
    value: 'no'
  ForwardX11:
    enabled: true
    value: 'no'
  Tunnel:
    enabled: true
    value: 'no'
  HostbasedAuthentication:
    enabled: true
    value: 'no'
  # Disable client-side password attempts if your production environment is
  # strictly key/certificate based.
