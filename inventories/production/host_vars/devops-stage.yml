---
linux_hardening_disable_core_dumps: true
linux_hardening_disable_ctrl_alt_del: true
linux_hardening_cron_permissions: true
linux_hardening_shadow_permissions: true
linux_hardening_passwd_permissions: true
linux_hardening_restrict_su: true
linux_hardening_minimize_path_permissions: true
linux_hardening_remove_insecure_packages: true
linux_hardening_remove_pam_ccreds: true
linux_hardening_pam_passwdqc: true
linux_hardening_pam_faillock: true
linux_hardening_pam_no_pass_expiry: true
linux_hardening_libuser_hash: true
linux_hardening_securetty: true
linux_hardening_shell_timeout: false
linux_hardening_shell_umask: true
linux_hardening_remove_rhosts: true
linux_hardening_remove_hosts_equiv: true
linux_hardening_remove_netrc: true
linux_hardening_suid_blacklist_enabled: true
linux_hardening_suid_remove_unknown: false
linux_hardening_system_account_shells: true
linux_hardening_system_account_lock: true
linux_hardening_user_password_ageing: false
linux_hardening_root_password_ageing: false
linux_hardening_remove_duplicate_root: true
linux_hardening_root_home_permissions: true
linux_hardening_user_home_permissions: true
linux_hardening_auditd_install: true
linux_hardening_auditd_service: true
linux_hardening_disable_journald_audit: true
linux_hardening_kernel_parameters: true
linux_hardening_refresh_initramfs: true
linux_hardening_path_directories:
  - /usr/local/sbin
  - /usr/local/bin
  - /usr/sbin
  - /usr/bin
  - /sbin
  - /bin
linux_hardening_insecure_packages:
  - xinetd
  - openbsd-inetd
  - inetutils-inetd
  - nis
  - telnetd
  - inetutils-telnetd
  - rsh-server
  - rsh-redone-server
  - prelink
linux_hardening_passwdqc_options: min=disabled,disabled,16,12,8
linux_hardening_faillock_settings:
  deny:
    enabled: true
    value: '10'
  unlock_time:
    enabled: true
    value: '600'
  # Very critical
  # brute-force DANGER
  even_deny_root:
    enabled: false
    value: ''
linux_hardening_libuser_hash_value: sha512
linux_hardening_root_ttys:
  - console
  - tty1
  - tty2
  - tty3
  - tty4
  - tty5
  - tty6
linux_hardening_shell_timeout_seconds: 600
linux_hardening_umask: '027'
linux_hardening_netrc_users_exempt: []
linux_hardening_users_exempt:
  - root
  - sync
  - shutdown
  - halt
linux_hardening_home_users_exempt: []
linux_hardening_age_users_exempt: []
linux_hardening_system_uid_max: 999
linux_hardening_uid_min: 1000
linux_hardening_uid_max: 60000
linux_hardening_password_min_age: 1
linux_hardening_password_max_age: 365
linux_hardening_password_warn_age: 30
linux_hardening_suid_blacklist:
  # Legacy r-services - assuming they are not used
  - /usr/bin/rcp
  - /usr/bin/rlogin
  - /usr/bin/rsh
  # Only add these after confirming they are unnecessary
  # - /usr/sbin/pppd
  # - /usr/bin/arping
  # - /usr/bin/mtr
  # - /usr/sbin/uuidd
linux_hardening_suid_whitelist:
  - /bin/mount
  - /bin/ping
  - /bin/su
  - /usr/bin/su
  - /bin/umount
  - /sbin/pam_timestamp_check
  - /sbin/unix_chkpwd
  - /usr/bin/at
  - /usr/bin/gpasswd
  - /usr/bin/locate
  - /usr/bin/newgrp
  - /usr/bin/passwd
  - /usr/bin/ssh-agent
  - /usr/sbin/lockdev
  - /usr/bin/expiry
  - /bin/ping6
  - /usr/bin/traceroute6.iputils
  - /sbin/mount.nfs
  - /sbin/umount.nfs
  - /sbin/mount.nfs4
  - /sbin/umount.nfs4
  - /usr/bin/crontab
  - /usr/bin/wall
  - /usr/bin/write
  - /usr/bin/screen
  - /usr/bin/mlocate
  - /usr/bin/chage
  - /usr/bin/chfn
  - /usr/bin/chsh
  - /bin/fusermount
  - /usr/bin/pkexec
  - /usr/bin/sudo
  - /usr/bin/sudoedit
  - /usr/sbin/postdrop
  - /usr/sbin/postqueue
  - /usr/sbin/suexec
  - /usr/lib/squid/ncsa_auth
  - /usr/lib/squid/pam_auth
  - /usr/sbin/ccreds_validate
  - /usr/bin/Xorg
  - /usr/bin/X
  - /usr/lib/dbus-1.0/dbus-daemon-launch-helper
  - /usr/lib/vte/gnome-pty-helper
  - /usr/lib/libvte9/gnome-pty-helper
  - /usr/lib/libvte-2.90-9/gnome-pty-helper
  - /usr/bin/mount
  - /usr/bin/umount
  - /usr/bin/ping
  - /usr/bin/fusermount3
  - /usr/sbin/unix_chkpwd
linux_hardening_sysctl_settings:
  fs.protected_hardlinks:
    enabled: true
    value: '1'
  fs.protected_symlinks:
    enabled: true
    value: '1'
  fs.protected_fifos:
    enabled: true
    value: '1'
  fs.protected_regular:
    enabled: true
    value: '2'
  fs.suid_dumpable:
    enabled: true
    value: '0'
  kernel.kptr_restrict:
    enabled: true
    value: '2'
  kernel.randomize_va_space:
    enabled: true
    value: '2'
  kernel.yama.ptrace_scope:
    enabled: true
    value: '1'
  net.ipv4.ip_forward:
    enabled: true
    value: '0'
  net.ipv4.conf.all.rp_filter:
    enabled: true
    value: '1'
  net.ipv4.conf.default.rp_filter:
    enabled: true
    value: '1'
  net.ipv4.conf.all.accept_source_route:
    enabled: true
    value: '0'
  net.ipv4.conf.default.accept_source_route:
    enabled: true
    value: '0'
  net.ipv4.conf.all.accept_redirects:
    enabled: true
    value: '0'
  net.ipv4.conf.default.accept_redirects:
    enabled: true
    value: '0'
  net.ipv4.conf.all.secure_redirects:
    enabled: true
    value: '0'
  net.ipv4.conf.default.secure_redirects:
    enabled: true
    value: '0'
  net.ipv4.conf.all.send_redirects:
    enabled: true
    value: '0'
  net.ipv4.conf.default.send_redirects:
    enabled: true
    value: '0'
  net.ipv4.icmp_echo_ignore_broadcasts:
    enabled: true
    value: '1'
  net.ipv4.icmp_ignore_bogus_error_responses:
    enabled: true
    value: '1'
  net.ipv4.tcp_syncookies:
    enabled: true
    value: '1'
  net.ipv4.tcp_rfc1337:
    enabled: true
    value: '1'
  net.ipv6.conf.all.forwarding:
    enabled: true
    value: '0'
  net.ipv6.conf.all.disable_ipv6:
    enabled: true
    value: '1'
  net.ipv6.conf.default.disable_ipv6:
    enabled: true
    value: '1'
  net.ipv6.conf.lo.disable_ipv6:
    enabled: true
    value: '1'
linux_hardening_modules:
  # Uncommon / legacy filesystems
  cramfs: true
  freevxfs: true
  jffs2: true
  hfs: true
  hfsplus: true
  udf: true
  # Network protocols rarely required on normal servers
  dccp: true
  rds: true
  sctp: true
  tipc: true
  # Keep available by default
  squashfs: false
  vfat: false
linux_hardening_login_defs:
