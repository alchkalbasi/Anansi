  UID_MAX:
    enabled: false
    value: '60000'
  SYS_UID_MIN:
    enabled: false
    value: '100'
  SYS_UID_MAX:
    enabled: false
    value: '999'
  GID_MIN:
    enabled: false
    value: '1000'
  GID_MAX:
    enabled: false
    value: '60000'
  SYS_GID_MIN:
    enabled: false
